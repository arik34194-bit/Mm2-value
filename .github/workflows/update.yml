name: Update MM2 Values

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Europe/Saratov"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Scrape values
        run: python scraper.py

      - name: Commit updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add values.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update MM2 values"
            git push
          fi          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update MM2 values"
            git push
          fi
